name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor; 24 is current LTS.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # Release builds must not restore a cache another workflow could have written.
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      # The process suite launches real Pi processes and PTYs; it stays a local gate.
      - run: npm run test:ci

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm Trusted Publishing (OIDC); also signs provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Trusted Publishing needs npm >= 11.5.1, which Node 24 bundles.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check tag matches package version
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}"
            exit 1
          fi
      # Skip a version already on npm: the first release is published by hand
      # (Trusted Publishing needs an existing package), and reruns stay safe.
      - name: Publish to npm
        run: |
          package_spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "${package_spec}" version > /dev/null 2>&1; then
            echo "${package_spec} is already published; skipping npm publish"
          else
            npm publish
          fi
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
